services:
  backend:
    build: ./backend
    env_file: .env
    environment:
      ERA5_CUBE_PATH: /app/var/era5_land_pl.zarr
      CACHE_PATH: /app/var/cache.sqlite
      # domyślnie Ollama z compose; inny serwer (np. Ollama na hoście z GPU) ustaw w .env
      WODIVA_OLLAMA_URL: ${WODIVA_OLLAMA_URL:-http://ollama:11434}
    volumes:
      - wodiva-var:/app/var
    ports:
      # tylko z tego hosta: z zewnątrz API idzie przez nginx, który nadpisuje X-Forwarded-For
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped

  ollama-pull:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: http://ollama:11434
    command: ["pull", "${WODIVA_OLLAMA_MODEL:-SpeakLeash/bielik-4.5b-v3.0-instruct:Q8_0}"]
    depends_on:
      - ollama
    restart: on-failure

  era5-updater:
    build: ./backend
    env_file: .env
    environment:
      ERA5_CUBE_PATH: /app/var/era5_land_pl.zarr
    volumes:
      - wodiva-var:/app/var
    command: ["python", "-m", "scripts.update_era5", "--loop"]
    restart: unless-stopped
    profiles: ["era5"]

volumes:
  wodiva-var:
  ollama-models:
