server {
    listen 80;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API: ta sama domena co frontend, więc bez CORS
    location ^~ /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        # nadpisane, nie dopisane: limit zapytań w backendzie bierze pierwszy adres z tego nagłówka
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # analiza działki trwa kilkanaście–kilkadziesiąt sekund
        proxy_read_timeout 120s;
    }

    # pliki z hashem w nazwie można trzymać w cache przeglądarki
    location ~* \.(?:js|css|woff2?|png|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: każda inna ścieżka (np. /raport/abc) → index.html
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
